x-runtime-defaults: &runtime-defaults
  image: "ghcr.io/gmnikhil/space-station:${SPACE_STATION_VERSION:?Set SPACE_STATION_VERSION in .env to an exact release such as 1.0.0}"
  pull_policy: always
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  web:
    <<: *runtime-defaults
    command: ["web"]
    environment:
      PORT: "5173"
      # Public mode metadata only; no GitHub credential is passed to the web role.
      GITHUB_AUTH_METHODS: "${GITHUB_AUTH_METHODS:-github_app}"
      GITHUB_CONFIGURED_PAT_LOGIN: "${GITHUB_CONFIGURED_PAT_LOGIN:-false}"
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:5173/health');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    <<: *runtime-defaults
    command: ["api"]
    env_file:
      - .env
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:3000/health');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  preview:
    <<: *runtime-defaults
    command: ["preview"]
    environment:
      PORT: "4000"
      # PAT previews call the API broker over the private Compose network.
      API_ORIGIN: "http://api:3000"
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:5173}"
      PREVIEW_ORIGIN: "${PREVIEW_ORIGIN:-http://localhost:4000}"
      GITHUB_API_URL: "${GITHUB_API_URL:-https://api.github.com}"
      GITHUB_AUTH_METHODS: "${GITHUB_AUTH_METHODS:-github_app}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-0}"
      GITHUB_PRIVATE_KEY: "${GITHUB_PRIVATE_KEY:-}"
      GITHUB_FIXTURE_MODE: "${GITHUB_FIXTURE_MODE:-0}"
      PREVIEW_SIGNING_SECRET: "${PREVIEW_SIGNING_SECRET:?Set PREVIEW_SIGNING_SECRET in .env}"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:4000/health');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
