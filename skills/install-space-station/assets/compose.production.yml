x-runtime-defaults: &runtime-defaults
  image: "ghcr.io/gmnikhil/space-station:${SPACE_STATION_VERSION:?Set SPACE_STATION_VERSION in .env to an exact release such as 1.0.0}"
  pull_policy: always
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  web:
    <<: *runtime-defaults
    command: ["web"]
    environment:
      PORT: "5173"
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:5173/health');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    <<: *runtime-defaults
    command: ["api"]
    env_file:
      - .env
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:3000/health');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  preview:
    <<: *runtime-defaults
    command: ["preview"]
    env_file:
      - .env
    environment:
      PORT: "4000"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:4000/health');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
